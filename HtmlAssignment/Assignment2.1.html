<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector example</title>
    <link rel="stylesheet" href="a2q1.css">
</head>
<body>

    <h1>Welcome to CSS selectors</h1>
    <p>This is a webpage</p>
    
    <div id="title">
        <p>It is a simple paragraph with id selector</p>

    <div class="intro">
        <h1>This is a class selector</h1>
        <p>This is another paragraph with class selector</p>
    </div>    
</body>
</html>
