<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
   <body>
    <h1>unorder list</h1>
    <ul>
     <li>apple</li>
     <li>pineapple</li>
     <li>banana</li>
    </ul>

    <h1>order list</h1>
    <ol>
     <li>apple</li>
     <li>pineapple</li>
     <li>banana</li>
    </ol>
   </body>
</html>
